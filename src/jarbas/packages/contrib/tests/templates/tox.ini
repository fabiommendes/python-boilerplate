[tox]
skipsdist = True
envlist = py27, py33, py34, py35, py36, pypy, docs, flake8

[testenv:docs]
basepython=python
changedir=docs
deps=sphinx
commands=
    sphinx-build -b html -d {envtmpdir}/doctrees . {envtmpdir}/html

[testenv:flake8]
basepython =
    python3.5
deps =
    flake8>=2.2.0
commands =
    flake8 src/{{ package }}

[testenv]
whitelist_externals = bash
install_command = pip install -e ".[dev]" -U {opts} {packages}
basepython =
    py27: python2.7
    py33: python3.3
    py34: python3.4
    py35: python3.5
    py35: python3.6
deps =
    python-boilerplate
commands = py.test src/{{ package }}/ --cov


